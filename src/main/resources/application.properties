spring.application.name=pedidos360-despachos
server.port=8084

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:despachosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# RabbitMQ
spring.rabbitmq.host=52.200.254.65
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuracion de la cola de despachos
app.rabbitmq.exchange=pedidos.exchange
app.rabbitmq.queue=cola.despachos
app.rabbitmq.routingkey=pedido.creado
